<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEXUS OMEGA</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f1115; color:#f2f2f2; padding:20px; }
    h1 { margin-bottom:4px; }
    .card { background:#181b22; border:1px solid #2a2e38; border-radius:12px; padding:16px; margin:14px 0; }
    textarea { width:100%; height:160px; background:#0b0d11; color:#00ff99; border:1px solid #333; border-radius:8px; padding:10px; }
    button { background:#2f80ed; color:white; border:0; padding:12px 16px; border-radius:8px; margin:8px 6px 8px 0; cursor:pointer; font-weight:bold; }
    button:hover { opacity:0.9; }
    pre { background:#050607; color:#c6f6d5; padding:14px; border-radius:8px; overflow:auto; white-space:pre-wrap; }
    input { width:100%; padding:10px; border-radius:8px; border:1px solid #333; background:#0b0d11; color:white; }
    .small { color:#aaa; font-size:13px; }
  </style>
</head>
<body>
  <h1>NEXUS OMEGA</h1>
  <div class="small">GitHub Pages frontend connected to GCP VM backend</div>

  <div class="card">
    <h2>Backend</h2>
    <input id="backend" value="http://136.114.174.54:8000" />
    <button onclick="health()">Health Check</button>
    <button onclick="capabilities()">Capabilities</button>
  </div>

  <div class="card">
    <h2>Browser Extract</h2>
    <textarea id="browserCmd">extract https://example.com</textarea>
    <button onclick="browserExtract()">Run Browser</button>
  </div>

  <div class="card">
    <h2>Product Team Research</h2>
    <textarea id="goal">Act as a real-time product team. Find urgent small business automation opportunities, score them, create a pilot offer, and generate outreach-ready deliverables.</textarea>
    <button onclick="research()">Run Research</button>
    <button onclick="productTeam()">Run Product Team</button>
  </div>

  <div class="card">
    <h2>Output</h2>
    <pre id="output">Ready.</pre>
  </div>

<script>
function backend() {
  return document.getElementById("backend").value.replace(/\/$/, "");
}

function show(data) {
  document.getElementById("output").textContent =
    typeof data === "string" ? data : JSON.stringify(data, null, 2);
}

async function health() {
  try {
    const res = await fetch(backend() + "/health");
    show(await res.json());
  } catch (e) { show("ERROR: " + e.message); }
}

async function capabilities() {
  try {
    const res = await fetch(backend() + "/api/data");
    show(await res.json());
  } catch (e) { show("ERROR: " + e.message); }
}

async function browserExtract() {
  try {
    const command = document.getElementById("browserCmd").value;
    const res = await fetch(backend() + "/api/browser", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ command })
    });
    show(await res.json());
  } catch (e) { show("ERROR: " + e.message); }
}

async function research() {
  try {
    const goal = document.getElementById("goal").value;
    const res = await fetch(backend() + "/api/research", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        goal,
        urls:[
          "https://news.ycombinator.com",
          "https://github.com/trending",
          "https://www.ycombinator.com/companies",
          "https://remoteok.com"
        ],
        max_urls:4,
        make_report:true
      })
    });
    show(await res.json());
  } catch (e) { show("ERROR: " + e.message); }
}

async function productTeam() {
  try {
    const goal = document.getElementById("goal").value;
    const res = await fetch(backend() + "/api/product-team", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        goal,
        niche:"small business AI automation",
        urls:[
          "https://news.ycombinator.com",
          "https://github.com/trending",
          "https://www.ycombinator.com/companies",
          "https://remoteok.com"
        ],
        max_urls:4,
        make_report:true
      })
    });
    show(await res.json());
  } catch (e) { show("ERROR: " + e.message); }
}
</script>
</body>
</html>
