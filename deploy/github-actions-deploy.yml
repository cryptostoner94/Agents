name: Deploy to EC2

on:
  push:
    branches:
      - main
      - production
  repository_dispatch:
    types:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Sync to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          # Sync files via rsync
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='data/' \
            --exclude='.env' \
            ./ ${EC2_USER}@${EC2_HOST}:/opt/nexus-omega/
          
          rm ec2_key.pem

      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
            cd /opt/nexus-omega
            
            # Install any new dependencies
            pip install -r requirements.txt -q
            
            # Restart service
            sudo systemctl restart nexus-omega
            
            # Health check
            sleep 5
            curl -sf http://127.0.0.1:8000/health && echo "✅ Deploy successful" || echo "❌ Health check failed"
          ENDSSH
          
          rm ec2_key.pem

      - name: Health check
        run: |
          curl -sf https://${EC2_HOST}/health || curl -sf http://${EC2_HOST}:8000/health